name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact-name: mdview-windows-amd64
            binary: mdview.exe
            upx: true
            extra-args: ''
          - os: macos-13
            platform: darwin/amd64
            artifact-name: mdview-darwin-amd64
            binary: mdview.app
            upx: false
            extra-args: ''
          - os: macos-latest
            platform: darwin/arm64
            artifact-name: mdview-darwin-arm64
            binary: mdview.app
            upx: false
            extra-args: ''
          - os: ubuntu-22.04
            platform: linux/amd64
            artifact-name: mdview-linux-amd64
            binary: mdview
            upx: true
            extra-args: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Set up UPX
        if: matrix.upx
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true

      - name: Build
        run: wails build -platform ${{ matrix.platform }}${{ matrix.upx && ' -upx' || '' }} ${{ matrix.extra-args }}

      - name: Package release zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item README.md build/bin/
          Copy-Item LICENSE build/bin/
          Compress-Archive -Path build/bin/${{ matrix.binary }}, build/bin/README.md, build/bin/LICENSE -DestinationPath build/bin/${{ matrix.artifact-name }}.zip

      - name: Package release zip (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp README.md build/bin/
          cp LICENSE build/bin/
          cd build/bin
          zip -r ${{ matrix.artifact-name }}.zip ${{ matrix.binary }} README.md LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: build/bin/${{ matrix.artifact-name }}.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/${{ matrix.artifact-name }}.zip
