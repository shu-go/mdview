name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  WAILS_VERSION: v3.0.0-beta.28

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: mdview-windows-amd64
            binary: mdview.exe
            package: false
            build-tags: ''
            apt-packages: ''
            upx: true
          - os: macos-15-intel
            artifact-name: mdview-darwin-amd64
            binary: mdview.app
            package: true
            build-tags: ''
            apt-packages: ''
            upx: false
          - os: macos-latest
            artifact-name: mdview-darwin-arm64
            binary: mdview.app
            package: true
            build-tags: ''
            apt-packages: ''
            upx: false
          - os: ubuntu-24.04
            artifact-name: mdview-linux-amd64-gtk4
            binary: mdview
            package: false
            build-tags: ''
            apt-packages: libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev
            upx: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt-packages }}

      - name: Install Wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      # Release builds take their version from the pushed tag (v2.4.0 -> 2.4.0)
      # rather than the value committed in build/config.yml.
      - name: Apply tag version to build assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%%[-+]*}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not contain an x.y.z version"
            exit 1
          fi
          sed -i.bak -E "s/^(  version: ).*/\1\"${VERSION}\"/" build/config.yml
          rm build/config.yml.bak
          grep -q "^  version: \"${VERSION}\"" build/config.yml
          wails3 task common:update:build-assets

      - name: Set up UPX
        if: matrix.upx
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true

      - name: Build
        if: '!matrix.package'
        run: wails3 build${{ matrix.build-tags && format(' -tags {0}', matrix.build-tags) || '' }}

      - name: Build and package (.app bundle)
        if: matrix.package
        run: wails3 package

      - name: Compress with UPX
        if: matrix.upx
        run: upx --best "bin/${{ matrix.binary }}"

      - name: Package release zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item README.md bin/
          Copy-Item LICENSE bin/
          Compress-Archive -Path bin/${{ matrix.binary }}, bin/README.md, bin/LICENSE -DestinationPath bin/${{ matrix.artifact-name }}.zip

      - name: Package release zip (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp README.md bin/
          cp LICENSE bin/
          cd bin
          zip -r ${{ matrix.artifact-name }}.zip ${{ matrix.binary }} README.md LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: bin/${{ matrix.artifact-name }}.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/${{ matrix.artifact-name }}.zip
