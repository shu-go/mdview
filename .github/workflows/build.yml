name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact-name: mdview-windows-amd64
            artifact-path: build/bin/mdview.exe
            upx: true
            extra-args: ''
          - os: macos-13
            platform: darwin/amd64
            artifact-name: mdview-darwin-amd64
            artifact-path: build/bin/mdview-darwin-amd64.zip
            upx: false
            extra-args: ''
          - os: macos-latest
            platform: darwin/arm64
            artifact-name: mdview-darwin-arm64
            artifact-path: build/bin/mdview-darwin-arm64.zip
            upx: false
            extra-args: ''
          - os: ubuntu-22.04
            platform: linux/amd64
            artifact-name: mdview-linux-amd64
            artifact-path: build/bin/mdview
            upx: true
            extra-args: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Set up UPX
        if: matrix.upx
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true

      - name: Build
        run: wails build -platform ${{ matrix.platform }}${{ matrix.upx && ' -upx' || '' }} ${{ matrix.extra-args }}

      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        run: cd build/bin && zip -r ${{ matrix.artifact-name }}.zip mdview.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact-path }}
