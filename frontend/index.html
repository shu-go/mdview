<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>mdview - Markdown ビューアー</title>
</head>
<body>
<div id="app">
    <!-- Drop Area -->
    <div id="drop-area" class="drop-area hidden" style="--wails-drop-target: drop;">
        <div class="drop-content">
            <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
            </svg>
            <h2 class="drop-title">Markdown Viewer</h2>
            <p class="drop-subtitle">Drag &amp; drop a Markdown file here, or click to select</p>
        </div>
    </div>

    <!-- Viewer Container -->
    <div id="viewer-container" class="viewer-container hidden" style="--wails-drop-target: drop;">
        <!-- Toolbar -->
        <header class="toolbar">
            <div class="toolbar-left">
                <span class="file-icon">📄</span>
                <span id="file-name" class="file-name"></span>
            </div>

            <div class="toolbar-center">
                <div class="segmented-control">
                    <button class="seg-btn active" data-mode="off">Normal</button>
                    <button class="seg-btn" data-mode="initial">Initial Diff</button>
                    <button class="seg-btn" data-mode="baseline">Baseline Diff</button>
                </div>
                <button id="btn-update-baseline" class="btn btn-secondary" title="Save current content as new diff baseline">
                    Update Baseline
                </button>
            </div>

            <div class="toolbar-right">
                <button id="btn-menu" class="btn btn-secondary">Menu</button>
            </div>
        </header>

        <!-- Content Area -->
        <main class="content-area">
            <div class="content-inner">
                <div id="front-matter-panel" class="front-matter-panel hidden"></div>
                <article id="markdown-body" class="markdown-body"></article>
            </div>
        </main>

        <!-- Edge-of-scroll flash indicators (shown briefly by g/G shortcuts) -->
        <div id="edge-flash-top" class="edge-flash edge-flash-top"></div>
        <div id="edge-flash-bottom" class="edge-flash edge-flash-bottom"></div>

        <!-- Link preview status bar -->
        <div id="link-preview" class="link-preview"></div>

        <!-- Zoom bar (bottom-right corner) -->
        <div id="zoom-bar" class="zoom-bar">
            <button id="btn-zoom-out" class="zoom-btn" title="Zoom out (Ctrl+-)">−</button>
            <span id="zoom-label" class="zoom-label">100%</span>
            <button id="btn-zoom-in" class="zoom-btn" title="Zoom in (Ctrl++)">+</button>
            <button id="btn-zoom-reset" class="zoom-btn zoom-reset-btn" title="Reset zoom (Ctrl+=)">1:1</button>
        </div>
    </div>
</div>
<!-- Font Picker Modal -->
<div id="font-modal" class="modal-backdrop hidden">
    <div class="modal-dialog">
        <div class="modal-header">
            <span class="modal-title">Font Settings</span>
            <button class="modal-close-btn" id="font-modal-close">✕</button>
        </div>
        <div class="modal-body">
            <label for="font-input" class="modal-label">CSS font</label>
            <input id="font-input" class="modal-input" type="text"
                   placeholder='bold 1em "Noto Sans", sans-serif'
                   autocomplete="off" spellcheck="false">
            <div class="font-preview" id="font-preview">
                The quick brown fox jumps over the lazy dog.<br>
                あいうえお かきくけこ さしすせそ たちつてと
            </div>
        </div>
        <div class="modal-footer">
            <button id="font-cancel-btn" class="btn btn-secondary">Cancel</button>
            <button id="font-apply-btn" class="btn btn-primary">Apply</button>
        </div>
    </div>
</div>

<!-- Context Menu -->
<div id="app-menu" class="app-menu hidden">
    <div class="menu-item has-submenu">
        <span class="menu-label">Color Scheme</span>
        <span class="menu-arrow">▶</span>
        <div class="submenu">
            <div class="menu-item submenu-item" data-theme="light">
                <span class="menu-check"></span><span>Light</span>
            </div>
            <div class="menu-item submenu-item" data-theme="system">
                <span class="menu-check"></span><span>System</span>
            </div>
            <div class="menu-item submenu-item" data-theme="dark">
                <span class="menu-check"></span><span>Dark</span>
            </div>
        </div>
    </div>
    <div class="menu-separator"></div>
    <div class="menu-item" id="menu-editor">Editor...</div>
    <div class="menu-item" id="menu-font">Font...</div>
</div>

<div class="search-panel hidden">
    <input class="search-input" type="text" placeholder="Search..." autocomplete="off" spellcheck="false">
    <span class="search-count"></span>
    <button class="search-nav-btn search-prev" title="Previous (Shift+F3)">▲</button>
    <button class="search-nav-btn search-next" title="Next (F3)">▼</button>
    <button class="search-close-btn" title="Close (Esc)">✕</button>
</div>
<script src="./src/main.js" type="module"></script>
</body>
</html>
